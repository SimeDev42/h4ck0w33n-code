<rect x="365" y="218" width="49" height="33" rx="3" fill="#a7b3bd"/><circle cx="390" cy="234" r="10" fill="#3b4650"/>
<text x="307" y="269" text-anchor="middle" font-size="11" fill="white">BOOT</text><text x="390" y="269" text-anchor="middle" font-size="11" fill="white">RESET</text>
<rect x="306" y="310" width="84" height="84" rx="3" transform="rotate(45 348 352)" fill="#11191e" stroke="#80919d" stroke-width="3"/>
<text x="348" y="356" text-anchor="middle" font-size="14" fill="#dce6ed">ESP32-C3</text>
<rect x="320" y="477" width="55" height="22" fill="#d4c3a6"/><text x="348" y="494" text-anchor="middle" font-size="11">ANT</text>
<text x="223" y="176" text-anchor="end" font-size="16">GPIO 5 · D3</text><circle cx="257" cy="170" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="170" r="4" fill="#344149"/><circle cx="439" cy="170" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="439" cy="170" r="4" fill="#344149"/><text x="223" y="220" text-anchor="end" font-size="16">GPIO 6 · D4</text><circle cx="257" cy="214" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="214" r="4" fill="#344149"/><circle cx="439" cy="214" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="439" cy="214" r="4" fill="#344149"/><text x="223" y="264" text-anchor="end" font-size="16">GPIO 7 · D5</text><circle cx="257" cy="258" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="258" r="4" fill="#344149"/><circle cx="439" cy="258" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="439" cy="258" r="4" fill="#344149"/><text x="467" y="264" font-size="16" fill="#64748b">3V3</text><text x="223" y="308" text-anchor="end" font-size="16">GPIO 8 · D8</text><circle cx="257" cy="302" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="302" r="4" fill="#344149"/><circle cx="439" cy="302" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="439" cy="302" r="4" fill="#344149"/><text x="223" y="352" text-anchor="end" font-size="16">GPIO 9 · D9</text><circle cx="257" cy="346" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="346" r="4" fill="#344149"/><circle cx="439" cy="346" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="439" cy="346" r="4" fill="#344149"/><text x="467" y="352" font-size="16" fill="#64748b">D1 / GPIO 3</text><text x="223" y="396" text-anchor="end" font-size="16">GPIO 10 · D10</text><circle cx="257" cy="390" r="10" fill="#d8b15c" stroke="#f4dc96" stroke-width="2"/><circle cx="257" cy="390" r="4" fil