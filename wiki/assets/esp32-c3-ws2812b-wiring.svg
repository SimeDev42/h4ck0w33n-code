<text x="940" y="429" text-anchor="middle" font-size="17" fill="#26734d">Arrows on the strip point away from DIN.</text>
<text x="40" y="558" font-size="18" font-weight="700">Use right-side pins 1, 2 and 4, counting from the USB end.</text>
<text x="40" y="587" font-size="17">Skip 3V3 (the third pin). The three LEDs are already joined by the strip traces.</text>
<text x="40" y="620" font-size="14" fill="#526176">Board pin positions follow your supplied photo; illustration is not to scale. Strip pad order varies: follow its printed labels.</text>
</g></svg>