<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">ESP32-C3 board layout and three-wire WS2812B connection</title>
<desc id="desc">Component-side view matching the supplied board photo, USB at top. Right-hand pins from top: 5V, GND, 3V3, GPIO4 D2, GPIO3 D1, GPIO2 D0, GPIO1, GPIO0. Connect first pin to strip 5V, second to GND and fourth to DIN. Left pins from top: GPIO5, GPIO6, GPIO7, GPIO8, GPIO9, GPIO10, GPIO20, GPIO21. Drawing is not to manufacturing scale.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26734d"/></marker></defs>
<rect width="1200" height="650" rx="16" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172337">
<text x="40" y="48" font-size="28" font-weight="700">ESP32-C3 → 3 × WS2812B</text>
<text x="40" y="78" font-size="17" fill="#526176">Your board layout · component side facing you · USB at the top</text>
<rect x="246" y="145" width="204" height="367" rx="8" fill="#202a31" stroke="#48545c" stroke-width="2"/>
<path d="M348 101V132" stroke="#64748b" stroke-width="12"/>
<rect x="306" y="125" width="84" height="79" rx="7" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
<rect x="318" y="130" width="60" height="13" rx="5" fill="#384550"/>
<text x="348" y="181" text-anchor="middle" font-size="16">USB-C</text>
